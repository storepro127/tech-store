<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>TECH STORE</title>
</head>

<body style="font-family:Arial;background:#f3f4f6">

<h1>🔥 TECH STORE</h1>

<div id="products"></div>

<script>

fetch("/api/products")
.then(res=>res.json())
.then(data=>{

data.forEach(p=>{

document.getElementById("products").innerHTML+=`

<div onclick="go(${p.id})"
style="background:white;padding:20px;margin:10px;cursor:pointer">

<img src="${p.image}" width="150">

<h3>${p.name}</h3>

<p>${p.price} جنيه</p>

</div>

`;

});

});

function go(id){
location.href="product.html?id="+id;
}

</script>

</body>
</html>
