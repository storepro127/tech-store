<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
</head>

<body>

<div id="product"></div>

<script>

const id=new URLSearchParams(location.search).get("id");

fetch("/api/products")
.then(r=>r.json())
.then(data=>{

const p=data.find(x=>x.id==id);

document.getElementById("product").innerHTML=`

<img src="${p.image}" width="300">

<h1>${p.name}</h1>

<p>${p.price} جنيه</p>

<button onclick='buy(${JSON.stringify(p)})'>
شراء
</button>

`;

});

function buy(p){

localStorage.setItem("cart",
JSON.stringify([{...p,qty:1}]));

location.href="cart.html";

}

</script>

</body>
</html>
