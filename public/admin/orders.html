<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
</head>

<body>

<h1>الطلبات</h1>

<div id="orders"></div>

<script>

fetch("/api/orders")
.then(r=>r.json())
.then(data=>{

data.reverse().forEach(o=>{

let items=JSON.parse(o.items);

orders.innerHTML+=`

<div style="border:1px solid;padding:10px;margin:10px">

<h3>${o.customer}</h3>

<p>${o.phone}</p>

<p>${o.address}</p>

<p>الإجمالي: ${o.total}</p>

</div>

`;

});

});

</script>

</body>
</html>
