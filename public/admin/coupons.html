<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
</head>

<body>

<h1>كوبون</h1>

<input id="code" placeholder="CODE">
<input id="discount" placeholder="%">

<button onclick="create()">إنشاء</button>

<div id="list"></div>

<script>

function load(){

fetch("/api/coupons")
.then(r=>r.json())
.then(data=>{

list.innerHTML="";

data.forEach(c=>{

list.innerHTML+=`

<div>
${c.code} - ${c.discount}%

<button onclick="del('${c.code}')">
حذف
</button>

</div>

`;

});

});

}

load();


async function create(){

await fetch("/api/coupons",{

method:"POST",
headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
code:code.value,
discount:discount.value
})

});

load();

}


async function del(code){

await fetch("/api/coupons/"+code,{
method:"DELETE"
});

load();

}

</script>

</body>
</html>
