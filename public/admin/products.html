<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
</head>

<body>

<h1>كل المنتجات</h1>

<div id="box"></div>

<script>

fetch("/api/products")
.then(r=>r.json())
.then(data=>{

data.forEach(p=>{

box.innerHTML+=`

<div style="border:1px solid;padding:10px;margin:10px">

<img src="${p.image}" width="80">

<h3>${p.name}</h3>

<button onclick="del(${p.id})">
حذف
</button>

</div>

`;

});

});


async function del(id){

await fetch("/api/products/"+id,{
method:"DELETE"
});

location.reload();

}

</script>

</body>
</html>
